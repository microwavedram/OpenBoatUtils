plugins {
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'maven-publish'
}

apply plugin: project.loom_plugin

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (project.loom_plugin == "fabric-loom") {
        mappings(loom.officialMojangMappings())
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    } else {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }
}

def rawVersion = project.findProperty("mod_version")
def resolvedVersion = rawVersion.replace("\${base_version}", base_version)

version = resolvedVersion

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_allowed_range", project.minecraft_version_allowed_range
    inputs.property "loader_version", project.loader_version
    inputs.property "fabric_api_version", project.fabric_api_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_version_allowed_range": project.minecraft_version_allowed_range,
                "loader_version": project.loader_version,
                "fabric_api_version": project.fabric_api_version
    }
}

def targetJavaVersion = project.java_release as int
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}

loom {
    runConfigs.all {
        ideConfigGenerated true // Run configurations are not created for subprojects by default
        runDir "../../run" // Use a shared run folder and just create separate worlds
    }
}

stonecutter {
    replacements.string(
            current.parsed.matches('>=26.1'),
            "!identifier"
    ) {
        replace 'ResourceLocation', 'Identifier'
    }

    replacements.string(
            current.parsed.matches('>=26.1'),
            "!bytebuf"
    ) {
        replace 'PacketByteBufs', 'FriendlyByteBufs'
    }

    replacements.string(
            current.parsed.matches('>=26.1'),
            "!lilypad"
    ) {
        replace 'WaterlilyBlock', 'LilyPadBlock'
    }
}
